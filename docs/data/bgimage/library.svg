<text x="66" y="129" font-family="Yu Gothic,Meiryo,sans-serif" font-weight="700" font-size="42" fill="#f2ebdb">閉館5分前の図書館</text>
<text x="70" y="680" font-family="Yu Gothic,Meiryo,sans-serif" font-size="20" fill="#b7c8c7">第一章 返却期限は、あと5分。</text>
